apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-staging-data
  labels:
    app: mysql-staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-staging
  labels:
    app: mysql-staging
spec:
  selector:
    app: mysql-staging
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-staging
  labels:
    app: mysql-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-staging
  template:
    metadata:
      labels:
        app: mysql-staging
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: cino_db
            - name: MYSQL_USER
              value: cino
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials-staging
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials-staging
                  key: password
          volumeMounts:
            - name: mysql-staging-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-staging-data
          persistentVolumeClaim:
            claimName: mysql-staging-data
