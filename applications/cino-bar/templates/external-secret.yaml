{{- if .Values.externalSecrets.enabled }}
{{- $serviceAccountName := include "cino-bar.externalSecretsServiceAccountName" . }}
{{- if .Values.externalSecrets.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  labels:
    {{- include "cino-bar.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ default .Values.database.secretName .Values.externalSecrets.target.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cino-bar.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ default "1h" .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ default "ClusterSecretStore" .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ default .Values.database.secretName .Values.externalSecrets.target.name }}
    creationPolicy: {{ default "Owner" .Values.externalSecrets.target.creationPolicy }}
  data:
    - secretKey: {{ default .Values.database.secretKey .Values.externalSecrets.data.databasePassword.secretKey }}
      remoteRef:
        key: {{ required "externalSecrets.data.databasePassword.remoteKey is required" .Values.externalSecrets.data.databasePassword.remoteKey }}
        {{- with .Values.externalSecrets.data.databasePassword.remoteProperty }}
        property: {{ . }}
        {{- end }}
        {{- with .Values.externalSecrets.data.databasePassword.remoteVersion }}
        version: {{ . }}
        {{- end }}
{{- end }}
