apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-credentials
  namespace: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cino
    kind: ClusterSecretStore
  target:
    name: mysql-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: cino/prod/backend
        property: DB_PASSWORD
